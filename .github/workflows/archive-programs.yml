name: Archive programs

# One-off: reads the 2021–22 to 2023–24 Undergraduate Calendars' program pages from academic-calendar-archive
# (scripts/fetch-archive-programs.mjs) into data/archive-programs/, for Pathways' older start years. The pages
# don't change, so this runs when the script is pushed, and by hand to fill any gaps.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/fetch-archive-programs.mjs
      - .github/workflows/archive-programs.yml

permissions:
  contents: write # commit data/archive-programs

concurrency:
  group: archive-programs
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Read the archive's program pages
        run: node scripts/fetch-archive-programs.mjs
      - name: Commit
        run: |
          if [ -n "$(git status --porcelain -- data/archive-programs)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/archive-programs
            git commit -m "Archive programs: the 2021–24 calendars' program pages"
            for i in 1 2 3; do git pull --rebase --quiet && git push && break; sleep 5; done
          fi
