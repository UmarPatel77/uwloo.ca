name: Build and deploy uwloo.ca

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 9 * * *" # daily, ~5 a.m. in Waterloo
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # Turns on Pages (source: GitHub Actions), sets the custom domain from CNAME,
      # enforces HTTPS once the certificate exists, and keeps Cloudflare DNS correct.
      # Safe to run every time: it only changes what's wrong. See README → Automatic setup.
      - name: Set up Pages and DNS
        run: node scripts/setup.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PAGES_ADMIN_TOKEN: ${{ secrets.PAGES_ADMIN_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # From https://github.com/settings/pages_verified_domains (public: it's in DNS anyway)
          PAGES_VERIFICATION_CODE: 67c92b5ca5948dbed6ce19ff0a1f40

      # Kuali and Open Data responses are cached between runs, so a normal day
      # only refetches changed courses and this term's seats.
      - name: Restore data cache
        uses: actions/cache/restore@v4
        with:
          path: .cache
          key: uwloo-data-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: uwloo-data-

      - name: Test
        run: npm test

      - name: Build
        id: build
        run: node scripts/build.mjs
        env:
          UW_API_KEY: ${{ secrets.UW_API_KEY }}

      # Saved even if a later step fails, so downloaded data is never thrown away.
      - name: Save data cache
        if: always() && steps.build.outcome != 'skipped'
        uses: actions/cache/save@v4
        with:
          path: .cache
          key: uwloo-data-${{ github.run_id }}-${{ github.run_attempt }}

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
