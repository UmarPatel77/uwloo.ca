name: Older calendars

# Reads the Graduate Calendars from Fall 2006 to Winter 2024 and the Undergraduate Calendars from 2020–21
# to 2023–24 (scripts/grad-archive.mjs) into data/grad-archive/ and data/ug-archive/, and rebuilds the site. Archives don't change, so this runs until every term it can
# read is in: each run starts the next one while there's work left, then it stops. Runs again on its own
# only when the reader changes; by hand from the Actions tab any time.
on:
  workflow_dispatch:
    inputs:
      minutes:
        description: Time budget in minutes
        default: "150"
      terms:
        description: Only these terms or undergrad years, e.g. 1069,1109,2324 (blank for all)
        default: ""
      redo:
        description: Read them again even if they're in already
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - scripts/grad-archive.mjs
      - scripts/lib/gradarchive.mjs
      - scripts/lib/ugarchive.mjs
      - .github/workflows/grad-archive.yml

permissions:
  contents: write # commit data/grad-archive and data/ug-archive
  actions: write # start the next run, and the site rebuild

concurrency:
  group: grad-archive
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # Every page fetched so far, so a rerun (after a parser fix, say) fetches nothing twice.
      - name: Restore page cache
        uses: actions/cache/restore@v5
        with:
          path: .cache/grad-archive
          key: uwloo-grad-archive-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: uwloo-grad-archive-

      # ucalendar.uwaterloo.ca doesn't send the intermediate certificate between its own and the root.
      # Browsers fetch it themselves; Node doesn't, so every request failed with
      # UNABLE_TO_VERIFY_LEAF_SIGNATURE. This fetches the missing intermediates from the address each
      # certificate names ("CA Issuers") and adds them to what Node trusts. Checking stays on: the chain must
      # still end at a root Node already trusts, and a root fetched this way is never added.
      - name: Complete ucalendar's certificate chain
        run: |
          out="$RUNNER_TEMP/extra-ca.pem"; : > "$out"
          cert=$(echo | openssl s_client -connect ucalendar.uwaterloo.ca:443 -servername ucalendar.uwaterloo.ca 2>/dev/null | openssl x509 2>/dev/null || true)
          [ -n "$cert" ] || { echo "No certificate from ucalendar; leaving it."; exit 0; }
          for i in 1 2 3; do
            url=$(echo "$cert" | openssl x509 -noout -text 2>/dev/null | grep -o 'CA Issuers - URI:[^ ,]*' | head -1 | sed 's/^CA Issuers - URI://' || true)
            [ -n "$url" ] || break
            curl -fsSL "$url" -o "$RUNNER_TEMP/issuer.crt" || break
            next=$(openssl x509 -inform DER -in "$RUNNER_TEMP/issuer.crt" 2>/dev/null || openssl x509 -in "$RUNNER_TEMP/issuer.crt" 2>/dev/null || true)
            [ -n "$next" ] || break
            subject=$(echo "$next" | openssl x509 -noout -subject | sed 's/^subject= *//')
            issuer=$(echo "$next" | openssl x509 -noout -issuer | sed 's/^issuer= *//')
            [ "$subject" = "$issuer" ] && break # a root: never added
            echo "$next" >> "$out"
            echo "Added intermediate: $subject"
            cert="$next"
          done
          if [ -s "$out" ]; then echo "NODE_EXTRA_CA_CERTS=$out" >> "$GITHUB_ENV"; else echo "Nothing to add."; fi

      - name: Read the calendars
        id: read
        run: node scripts/grad-archive.mjs --minutes "${{ inputs.minutes || '150' }}" ${{ inputs.terms && format('--terms {0}', inputs.terms) || '' }} ${{ inputs.redo && '--redo' || '' }}
        env:
          UW_API_KEY: ${{ secrets.UW_API_KEY }} # Open Data's course catalog stands in for Winter 2020 to Winter 2024

      - name: Save page cache
        if: always() && steps.read.outcome != 'skipped'
        uses: actions/cache/save@v5
        with:
          path: .cache/grad-archive
          key: uwloo-grad-archive-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Commit, rebuild, and carry on
        run: |
          if [ -n "$(git status --porcelain -- data/grad-archive data/ug-archive)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/grad-archive data/ug-archive
            if git diff --cached --quiet -- data/grad-archive/terms data/grad-archive/entries.json data/ug-archive/terms data/ug-archive/entries.json; then
              echo "Only the report changed: no rebuild."
              REBUILD=no
            fi
            git commit -m "Older calendars: $(node -e "const fs=require('fs');const n=(d)=>fs.existsSync(d)?fs.readdirSync(d).length:0;console.log(n('data/grad-archive/terms')+' grad terms, '+n('data/ug-archive/terms')+' undergrad years')")"
            for i in 1 2 3; do git pull --rebase --quiet && git push && break; sleep 5; done
            [ "$REBUILD" = "no" ] || gh workflow run deploy.yml --ref main
          else
            echo "No change in data/grad-archive or data/ug-archive."
          fi
          if [ "${{ steps.read.outputs.more }}" = "true" ]; then
            echo "Terms left: starting the next run."
            gh workflow run grad-archive.yml --ref main -f minutes="${{ inputs.minutes || '150' }}"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
