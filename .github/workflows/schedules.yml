name: Past class schedules

# Reads every course's past sections (Spring 2004 to early 2026) from WClasses (scripts/schedules.mjs) into
# data/schedules/. WClasses no longer updates, so each course is read once: each run starts the next while
# courses are left, then it stops. By hand from the Actions tab any time ("probe" runs the checks and stops).
on:
  workflow_dispatch:
    inputs:
      minutes:
        description: Time budget in minutes
        default: "150"
      only:
        description: Only these courses, e.g. CS135,ECON355 (blank for all not in yet)
        default: ""
      probe:
        description: Just run the checks (ECON 355 in Fall 2015, CS 135's page)
        type: boolean
        default: false

permissions:
  contents: write # commit data/schedules
  actions: write # start the next run

concurrency:
  group: schedules
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Read the schedules
        id: read
        run: node scripts/schedules.mjs --minutes "${{ inputs.minutes || '150' }}" ${{ inputs.only && format('--only {0}', inputs.only) || '' }} ${{ inputs.probe && '--probe' || '' }}

      - name: Commit and carry on
        if: always() && steps.read.outcome == 'success'
        run: |
          if [ -n "$(git status --porcelain -- data/schedules)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/schedules
            git commit -m "Past class schedules from WClasses: $(ls data/schedules | grep -c '^[A-Z]*\.json$') subjects"
            for i in 1 2 3; do git pull --rebase --quiet && git push && break; sleep 5; done
          fi
          if [ "${{ steps.read.outputs.more }}" = "true" ]; then
            echo "Terms left: starting the next run."
            gh workflow run schedules.yml --ref main -f minutes="${{ inputs.minutes || '150' }}"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
